name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PNPM_VERSION: 10.33.0
  NODE_VERSION: 22

jobs:
  build-test:
    name: build and test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TEST_ADMIN_DATABASE_URL: postgres://maritime:maritime@127.0.0.1:5432/postgres
      EVENT_BUS: memory
      NATS_URL: nats://127.0.0.1:4222
      CI: "true"
    steps:
      - uses: actions/checkout@v4
      # Service containers cannot take command arguments, and JetStream needs -js: run NATS as a container step.
      - name: start NATS JetStream
        run: |
          docker run -d --name nats -p 4222:4222 -p 8222:8222 nats:2.11-alpine -js -m 8222
          for i in $(seq 1 30); do curl -fs http://127.0.0.1:8222/healthz >/dev/null && break; sleep 1; done
          curl -fs http://127.0.0.1:8222/healthz
      # The platform needs PostGIS and pgvector in the same database and no upstream image ships both, which
      # is why infra/docker/postgres.Dockerfile exists. CI builds and runs that image rather than the
      # upstream one, so the tests run against the database the development stack actually uses: on
      # postgis/postgis alone the vector extension is absent, the assistant's migration degrades to the
      # in-process path by design, and the tests that assert it ranks in SQL fail with nothing wrong.
      # It cannot be a service container because those start before the checkout that supplies the file.
      - name: start PostgreSQL with PostGIS and pgvector
        run: |
          docker build -t maritime/postgres:16-3.4 -f infra/docker/postgres.Dockerfile infra/docker
          docker run -d --name postgres -p 5432:5432 \
            -e POSTGRES_USER=maritime -e POSTGRES_PASSWORD=maritime -e POSTGRES_DB=postgres \
            maritime/postgres:16-3.4
          # Wait over TCP, not the socket. The entrypoint brings up a temporary socket-only server to run the
          # init scripts and then restarts with the real configuration, so a socket check passes during init
          # and the tests then race the restart.
          for i in $(seq 1 90); do docker exec postgres pg_isready -h 127.0.0.1 -U maritime -d postgres >/dev/null 2>&1 && break; sleep 1; done
          docker exec postgres pg_isready -h 127.0.0.1 -U maritime -d postgres
          # A smoke test that the extension is installed, not provisioning: extensions are per-database and
          # each service's migration creates its own. Failing here says "the image is wrong" in one line,
          # instead of six assertions later saying "retrieval is in memory" and meaning the same thing.
          docker exec postgres psql -U maritime -d postgres -c "CREATE EXTENSION IF NOT EXISTS vector"
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r build
      - run: pnpm -r test
      - name: render gateway configurations from the route table
        run: |
          pnpm -s gateway:kong > /tmp/kong.yml
          pnpm -s gateway:nginx > /tmp/api-locations.conf
          test -s /tmp/kong.yml && test -s /tmp/api-locations.conf
      - name: validate compose and Keycloak realm
        run: |
          docker compose -f infra/compose/docker-compose.yml --profile planned --profile ai config --quiet
          docker compose -f infra/compose/docker-compose.yml -f infra/compose/docker-compose.uat.yml config --quiet
          node -e "JSON.parse(require('fs').readFileSync('infra/keycloak/realm-maritime.json','utf8'))"

  sast:
    name: security scans
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: semgrep (blocking on ERROR severity)
        run: |
          docker run --rm -v "$PWD:/src" -w /src semgrep/semgrep:latest \
            semgrep scan --config p/default --config .semgrep.yml --severity ERROR --error --metrics=off \
              --exclude node_modules --exclude dist --exclude '*.lock' --exclude pnpm-lock.yaml
      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}
          GITLEAKS_CONFIG: .gitleaks.toml
          GITLEAKS_ENABLE_SUMMARY: "true"
      - name: trivy filesystem scan (vulnerabilities, secrets, misconfigurations)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          # Accepted findings live in the file with their reasons, scoped to the path each applies to.
          trivyignores: .trivyignore.yaml
          exit-code: "1"
          skip-dirs: node_modules,dist,.turbo
          format: table

  web:
    name: web app
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: build-test
    steps:
      - uses: actions/checkout@v4
      - name: detect web app
        id: web
        run: |
          if [ -f apps/web/package.json ]; then echo "present=true" >> "$GITHUB_OUTPUT"; else echo "present=false" >> "$GITHUB_OUTPUT"; echo "apps/web not present yet; skipping"; fi
      - uses: pnpm/action-setup@v4
        if: hashFiles('apps/web/package.json') != ''
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        if: hashFiles('apps/web/package.json') != ''
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - if: hashFiles('apps/web/package.json') != ''
        run: pnpm install --frozen-lockfile
      # The trailing `...` builds the workspace packages the web app depends on before it builds the app.
      # Without it `@maritime/contracts` is never compiled, its type declarations do not exist, and every
      # file importing them fails to typecheck — which is what this job did the first time it ever ran.
      - if: hashFiles('apps/web/package.json') != ''
        run: pnpm --filter @maritime/web... build
      - if: hashFiles('apps/web/package.json') != ''
        run: pnpm --filter @maritime/web test

  e2e:
    name: end-to-end drives
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: build-test
    env:
      EVENT_BUS: nats
      NATS_URL: nats://127.0.0.1:4222
      AUTH_MODE: local
      CI: "true"
    steps:
      - uses: actions/checkout@v4
      # The drives run against the real stack: every service started natively from its build, seeded with
      # the shared fictional world, behind the gateway the Vite dev server proxies to. Same NATS and
      # PostgreSQL bring-up as the build job, for the same reasons.
      - name: start NATS JetStream
        run: |
          docker run -d --name nats -p 4222:4222 -p 8222:8222 nats:2.11-alpine -js -m 8222
          for i in $(seq 1 30); do curl -fs http://127.0.0.1:8222/healthz >/dev/null && break; sleep 1; done
          curl -fs http://127.0.0.1:8222/healthz
      - name: start PostgreSQL with PostGIS and pgvector
        run: |
          docker build -t maritime/postgres:16-3.4 -f infra/docker/postgres.Dockerfile infra/docker
          docker run -d --name postgres -p 5432:5432 \
            -e POSTGRES_USER=maritime -e POSTGRES_PASSWORD=maritime -e POSTGRES_DB=postgres \
            maritime/postgres:16-3.4
          for i in $(seq 1 90); do docker exec postgres pg_isready -h 127.0.0.1 -U maritime -d postgres >/dev/null 2>&1 && break; sleep 1; done
          docker exec postgres pg_isready -h 127.0.0.1 -U maritime -d postgres
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r build
      - name: seed the world and start every service
        run: |
          infra/local/services.sh seed
          infra/local/services.sh start
          # the gateway answers last, once every service behind it is up
          for i in $(seq 1 60); do infra/local/services.sh status | grep -q "^gateway: up" && break; sleep 2; done
          infra/local/services.sh status
          infra/local/services.sh status | grep -q "down" && { echo "a service did not come up"; tail -n 40 .local/log/*.log; exit 1; } || true
      - name: playwright drives
        run: |
          pnpm --filter @maritime/web exec playwright install --with-deps chromium
          pnpm e2e
      - name: upload playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            apps/web/playwright-report
            apps/web/test-results
            .local/log
          if-no-files-found: ignore
          retention-days: 7

  containers:
    name: container images
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: build-test
    # Runs on pull requests as well as on main. It used to be main-only, which meant a branch could go
    # green with this job skipped and the failure would only appear after the merge — which is exactly
    # how a broken image build survived in the repository.
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: services/mdm
            port: 5402
          - service: services/gateway
            port: 5200
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: build ${{ matrix.service }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/docker/service.Dockerfile
          build-args: |
            SERVICE=${{ matrix.service }}
            PORT=${{ matrix.port }}
          push: false
          load: true
          tags: maritime/${{ matrix.service }}:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: smoke test the image
        run: |
          docker run --rm -d --name smoke -p ${{ matrix.port }}:${{ matrix.port }} -e EVENT_BUS=memory -e DATABASE_URL=postgres://maritime:maritime@127.0.0.1:5432/nope maritime/${{ matrix.service }}:ci || true
          sleep 5
          docker logs smoke || true
          docker rm -f smoke || true

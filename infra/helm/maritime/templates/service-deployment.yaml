{{- $root := . -}}
{{- $defaults := .Values.serviceDefaults -}}
{{- range $svc := .Values.services }}
{{- $ctx := dict "root" $root "svc" $svc -}}
{{- $autoscaling := mergeOverwrite (deepCopy $defaults.autoscaling) (default (dict) $svc.autoscaling) -}}
{{- $resources := default $defaults.resources $svc.resources -}}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $svc.name }}
  labels:
    {{- include "maritime.labels" $root | nindent 4 }}
    {{- include "maritime.selectorLabels" $ctx | nindent 4 }}
    maritime.io/tier: {{ default "platform" $svc.tier | quote }}
spec:
  {{- if not $autoscaling.enabled }}
  replicas: {{ default $defaults.replicas $svc.replicas }}
  {{- end }}
  revisionHistoryLimit: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      {{- include "maritime.selectorLabels" $ctx | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "maritime.labels" $root | nindent 8 }}
        {{- include "maritime.selectorLabels" $ctx | nindent 8 }}
        maritime.io/tier: {{ default "platform" $svc.tier | quote }}
        {{- with $root.Values.global.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      annotations:
        checksum/config: {{ include (print $root.Template.BasePath "/configmap.yaml") $root | sha256sum }}
        {{- with $root.Values.global.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with $root.Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      terminationGracePeriodSeconds: {{ default $defaults.terminationGracePeriodSeconds $svc.terminationGracePeriodSeconds }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    {{- include "maritime.selectorLabels" $ctx | nindent 20 }}
      containers:
        - name: {{ $svc.name }}
          image: {{ include "maritime.image" $ctx | quote }}
          imagePullPolicy: {{ $root.Values.global.imagePullPolicy }}
          ports:
            - name: http
              containerPort: {{ $svc.port }}
              protocol: TCP
          env:
            - name: SERVICE_NAME
              value: {{ $svc.name | quote }}
            - name: PORT
              value: {{ $svc.port | quote }}
            - name: HOST
              value: "0.0.0.0"
            {{- if ne (default true $svc.database) false }}
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ $root.Values.secrets.existingSecret }}
                  key: {{ include "maritime.databaseKey" $svc }}
            {{- end }}
            - name: SERVICE_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ $root.Values.secrets.existingSecret }}
                  key: SERVICE_TOKEN
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ $root.Values.secrets.existingSecret }}
                  key: JWT_SECRET
            {{- range $key, $value := $svc.env }}
            - name: {{ $key }}
              value: {{ $value | quote }}
            {{- end }}
          envFrom:
            - configMapRef:
                name: {{ include "maritime.fullname" $root }}-config
          livenessProbe:
            httpGet:
              path: {{ default $defaults.livenessPath $svc.livenessPath }}
              port: http
            initialDelaySeconds: 15
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: {{ default $defaults.readinessPath $svc.readinessPath }}
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            {{- toYaml $resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
{{- end }}
